# 前端静态资源 + 四个后端前缀的同源反代。
# 四条 location 的顺序与 vite.config.js 的 proxy 完全一致——顺序错了就是
# 「/api 把 /api/realtime 吃掉」，页面空白但服务都好好的。
#
# 后端地址是 127.0.0.1 而不是服务名：本机 docker 用 host 网络（原因见
# docker-compose.yml 末尾），没有 compose 内网 DNS，端口就是宿主机端口。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 埋点上报 → business
    location /api/track {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 实时指标 + SSE → realtime
    location /api/realtime {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 是长连接：不缓冲、不断开
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # 离线指标 → analysis
    location /api/screen {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其余业务接口 → business（必须放最后）
    location /api {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # vue-router 走 history 模式，刷新子路由要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
